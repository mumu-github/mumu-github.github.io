<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Origin asset probe</title></head>
<body style="margin:0;background:#fff;font:700 36px/1.4 system-ui;padding:40px">
<div id="status">loading origin...</div>
<script>
const url='https://gaoyuai.xyz/models/su7.glb?probe=1';
const t0=performance.now();
fetch(url,{mode:'no-cors',cache:'no-store'}).then(r=>r.blob()).then(()=>{
  const s=((performance.now()-t0)/1000).toFixed(2);
  document.body.innerHTML='<div style="font-size:64px;line-height:1.3">Origin 2.27 MB<br>in '+s+' s</div>';
}).catch(e=>{document.body.innerHTML='<div style="font-size:40px">Origin error: '+e+'</div>'});
</script></body></html>
