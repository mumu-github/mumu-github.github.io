<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>jsDelivr asset probe</title></head>
<body style="margin:0;background:#fff;font:700 36px/1.4 system-ui;padding:40px">
<div id="status">loading jsDelivr...</div>
<script>
const url='https://cdn.jsdelivr.net/gh/mumu-github/mumu-github.github.io@main/models/su7.glb';
const t0=performance.now();
fetch(url,{cache:'no-store'}).then(r=>r.arrayBuffer()).then(b=>{
  const s=((performance.now()-t0)/1000).toFixed(2);
  const mb=(b.byteLength/1048576).toFixed(2);
  document.body.innerHTML='<div style="font-size:64px;line-height:1.3">jsDelivr '+mb+' MB<br>in '+s+' s</div>';
}).catch(e=>{document.body.innerHTML='<div style="font-size:40px">jsDelivr error: '+e+'</div>'});
</script></body></html>
